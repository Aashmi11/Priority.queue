services:
  postgres:
    image: postgres:16-alpine
    container_name: ppq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ppq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppq_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ppq_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ppq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ppq_user} -d ${POSTGRES_DB:-ppq_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ppq_pgdata:
